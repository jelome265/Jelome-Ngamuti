name: Validate portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/portfolio-design-skill"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Frontend design skill lint
        run: node .claude/skills/design-taste-frontend/scripts/lint.mjs src

      - name: Build
        run: npm run build
